<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인생 스톱워치</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --green: #30d158;
    --green-dim: #1f7a37;
    --red: #ff453a;
    --red-dim: #8f2a24;
    --gray-btn: #3a3a3c;
    --track: #1c1c1e;
    --text: #f5f5f7;
    --muted: #8e8e93;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #17181c, #030304 70%);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 32px 16px;
  }
  .app {
    width: 300px;
  }

  /* birthdate control strip */
  .birth-section {
    background: #1c1c1e;
    border: 1px solid #2c2c2e;
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 22px;
    text-align: left;
  }
  .birth-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .birth-row label {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  .birth-row input[type="date"] {
    flex: 1;
    background: #2c2c2e;
    border: 1px solid #3a3a3c;
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 14px;
    color-scheme: dark;
  }
  .birth-row input[type="date"]:disabled { opacity: 0.5; }
  .birth-info {
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.5;
  }
  .birth-info.error { color: var(--red); }

  /* watch case */
  .watch-case {
    position: relative;
    width: 300px;
    height: 372px;
    margin: 0 auto;
    border-radius: 66px;
    padding: 12px;
    background: linear-gradient(155deg, #4a4c52 0%, #26262a 45%, #131316 100%);
    box-shadow: 0 24px 50px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .crown {
    position: absolute;
    right: -9px;
    top: 32%;
    width: 16px;
    height: 56px;
    border-radius: 7px;
    background: linear-gradient(90deg, #57585e, #232326);
    box-shadow: 1px 0 2px rgba(0,0,0,0.4);
  }
  .side-button {
    position: absolute;
    right: -7px;
    top: 52%;
    width: 12px;
    height: 42px;
    border-radius: 6px;
    background: linear-gradient(90deg, #57585e, #232326);
    box-shadow: 1px 0 2px rgba(0,0,0,0.4);
  }
  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    border-radius: 54px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 26px 20px 20px;
  }

  .time-display {
    font-variant-numeric: tabular-nums;
    text-align: center;
    line-height: 1;
    margin-bottom: 14px;
  }
  .time-display .main {
    font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .time-display .cc {
    font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size: 18px;
    font-weight: 500;
    color: var(--muted);
  }

  /* life dial (doubles as the analog stopwatch dial) */
  .dial {
    position: relative;
    width: 176px;
    height: 176px;
    margin-bottom: 16px;
  }
  .dial-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .dial-ring .ring-track {
    fill: none;
    stroke: var(--track);
    stroke-width: 9;
  }
  .dial-ring .ring-progress {
    fill: none;
    stroke: var(--red);
    stroke-width: 9;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.2s linear;
  }
  .dial-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
  }
  .dial-label {
    font-size: 9.5px;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .dial-main {
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
  }
  .dial-sub {
    font-variant-numeric: tabular-nums;
    font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    font-size: 19px;
    font-weight: 700;
    color: var(--red);
    margin-top: 3px;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  button {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button svg { width: 20px; height: 20px; }
  button:active { transform: scale(0.92); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  #startBtn { background: var(--green); color: #04220f; }
  #stopBtn { background: var(--red); color: #2a0705; }
  #lapBtn, #resetBtn { background: var(--gray-btn); color: var(--text); }

  /* lap list, watchOS-style rows */
  .laps {
    width: 100%;
    max-height: 200px;
    overflow-y: auto;
    margin-top: 20px;
    border-top: 1px solid #1f1f22;
  }
  .laps::-webkit-scrollbar { width: 4px; }
  .laps::-webkit-scrollbar-thumb { background: #2c2c2e; border-radius: 2px; }
  .lap-item {
    padding: 10px 4px;
    font-size: 12.5px;
    border-bottom: 1px solid #1f1f22;
  }
  .lap-item:last-child { border-bottom: none; }
  .lap-row {
    display: flex;
    justify-content: space-between;
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .lap-remaining {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
  }
  .empty {
    color: #48484a;
    font-size: 12.5px;
    padding: 14px 0;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="birth-section">
      <div class="birth-row">
        <label for="birthdate">생년월일</label>
        <input type="date" id="birthdate">
      </div>
      <div class="birth-info" id="birthInfo">생년월일을 입력하면 기대 수명 100세 기준 잔여 수명이 표시됩니다.</div>
    </div>

    <div class="watch-case">
      <div class="crown"></div>
      <div class="side-button"></div>
      <div class="screen">
        <div class="time-display">
          <span class="main" id="time">00:00:00</span><span class="cc" id="ms">.00</span>
        </div>

        <div class="dial">
          <svg class="dial-ring" viewBox="0 0 200 200">
            <circle class="ring-track" cx="100" cy="100" r="90"></circle>
            <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90"></circle>
          </svg>
          <div class="dial-content">
            <div class="dial-label">잔여수명</div>
            <div class="dial-main" id="lifeMain">--년 --개월 --일</div>
            <div class="dial-sub" id="lifeSub">--:--:--</div>
          </div>
        </div>

        <div class="controls">
          <button id="startBtn" disabled aria-label="시작">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="stopBtn" disabled aria-label="정지">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
        </div>
        <div class="controls">
          <button id="lapBtn" disabled aria-label="랩">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          </button>
          <button id="resetBtn" disabled aria-label="리셋">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="laps" id="laps">
      <div class="empty" id="emptyMsg">기록된 랩이 없습니다</div>
    </div>
  </div>

<script>
  const LIFE_EXPECTANCY_YEARS = 100;

  let startTime = 0;
  let elapsed = 0;
  let timerId = null;
  let running = false;
  let lapCount = 0;

  let birthDate = null;
  let deathDate = null;
  let baselineNow = null;
  let totalLifeMs = null;

  const birthdateInput = document.getElementById('birthdate');
  const birthInfo = document.getElementById('birthInfo');
  const lifeMainEl = document.getElementById('lifeMain');
  const lifeSubEl = document.getElementById('lifeSub');
  const ringProgress = document.getElementById('ringProgress');
  const RING_CIRCUMFERENCE = 2 * Math.PI * 90;
  ringProgress.style.strokeDasharray = `${RING_CIRCUMFERENCE}`;
  ringProgress.style.strokeDashoffset = `${RING_CIRCUMFERENCE}`;
  const timeEl = document.getElementById('time');
  const msEl = document.getElementById('ms');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lapsEl = document.getElementById('laps');
  const emptyMsg = document.getElementById('emptyMsg');

  const todayStr = new Date().toISOString().split('T')[0];
  birthdateInput.max = todayStr;
  birthdateInput.min = '1900-01-01';

  const pad = (n, len = 2) => String(n).padStart(len, '0');

  function formatElapsed(ms) {
    const totalMs = Math.max(0, Math.floor(ms));
    const hours = Math.floor(totalMs / 3600000);
    const minutes = Math.floor((totalMs % 3600000) / 60000);
    const seconds = Math.floor((totalMs % 60000) / 1000);
    const centis = Math.floor((totalMs % 1000) / 10);
    return {
      main: `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`,
      ms: `.${pad(centis)}`
    };
  }

  function formatDate(d) {
    return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  }

  function getRemainingBreakdown(fromDate, toDate) {
    let y = toDate.getFullYear() - fromDate.getFullYear();
    let mo = toDate.getMonth() - fromDate.getMonth();
    let d = toDate.getDate() - fromDate.getDate();
    let h = toDate.getHours() - fromDate.getHours();
    let mi = toDate.getMinutes() - fromDate.getMinutes();
    let s = toDate.getSeconds() - fromDate.getSeconds();

    if (s < 0) { s += 60; mi--; }
    if (mi < 0) { mi += 60; h--; }
    if (h < 0) { h += 24; d--; }
    if (d < 0) {
      const prevMonthDays = new Date(toDate.getFullYear(), toDate.getMonth(), 0).getDate();
      d += prevMonthDays; mo--;
    }
    if (mo < 0) { mo += 12; y--; }
    return { y, mo, d, h, mi, s };
  }

  function currentElapsedMs() {
    return running ? elapsed + (performance.now() - startTime) : elapsed;
  }

  function getVirtualNow() {
    return new Date(baselineNow.getTime() + currentElapsedMs());
  }

  function renderLife(targetDate) {
    if (!deathDate) return { main: '--년 --개월 --일', sub: '--:--:--' };
    let from = targetDate;
    if (from.getTime() >= deathDate.getTime()) {
      return { main: '0년 0개월 0일', sub: '00:00:00', reached: true };
    }
    const b = getRemainingBreakdown(from, deathDate);
    return {
      main: `${b.y}년 ${b.mo}개월 ${b.d}일`,
      sub: `${pad(b.h)}:${pad(b.mi)}:${pad(b.s)}`,
      reached: false
    };
  }

  function updateRing(virtualNow) {
    const remainingMs = Math.min(totalLifeMs, Math.max(0, deathDate.getTime() - virtualNow.getTime()));
    const fraction = remainingMs / totalLifeMs;
    const offset = RING_CIRCUMFERENCE * (1 - fraction);
    ringProgress.style.strokeDashoffset = `${offset}`;
  }

  function render() {
    const curElapsed = currentElapsedMs();
    const { main, ms } = formatElapsed(curElapsed);
    timeEl.textContent = main;
    msEl.textContent = ms;

    if (deathDate) {
      const virtualNow = getVirtualNow();
      const life = renderLife(virtualNow);
      lifeMainEl.textContent = life.main;
      lifeSubEl.textContent = life.sub;
      updateRing(virtualNow);
      if (life.reached) {
        birthInfo.textContent = '설정된 기대 수명(100세)에 도달했습니다.';
        birthInfo.classList.add('error');
      }
    }
  }

  function tick() {
    render();
    timerId = requestAnimationFrame(tick);
  }

  function applyBirthdate() {
    const val = birthdateInput.value;
    if (!val) return;
    const [y, m, d] = val.split('-').map(Number);
    const candidate = new Date(y, m - 1, d, 0, 0, 0, 0);
    const now = new Date();

    if (candidate.getTime() > now.getTime()) {
      birthInfo.textContent = '생년월일은 오늘 이전이어야 합니다.';
      birthInfo.classList.add('error');
      startBtn.disabled = true;
      deathDate = null;
      totalLifeMs = null;
      lifeMainEl.textContent = '--년 --개월 --일';
      lifeSubEl.textContent = '--:--:--';
      ringProgress.style.strokeDashoffset = `${RING_CIRCUMFERENCE}`;
      return;
    }

    birthDate = candidate;
    deathDate = new Date(birthDate);
    deathDate.setFullYear(deathDate.getFullYear() + LIFE_EXPECTANCY_YEARS);
    totalLifeMs = deathDate.getTime() - birthDate.getTime();
    baselineNow = new Date();
    elapsed = 0;

    birthInfo.classList.remove('error');
    birthInfo.textContent = `기대 수명 ${LIFE_EXPECTANCY_YEARS}세 기준 예상 종료 시점: ${formatDate(deathDate)}`;

    startBtn.disabled = false;
    render();
  }

  function setBirthInputEditable(editable) {
    birthdateInput.disabled = !editable;
  }

  function start() {
    if (!deathDate) return;
    running = true;
    startTime = performance.now();
    timerId = requestAnimationFrame(tick);
    setBirthInputEditable(false);
    startBtn.disabled = true;
    stopBtn.disabled = false;
    lapBtn.disabled = false;
    resetBtn.disabled = false;
  }

  function stop() {
    running = false;
    elapsed += performance.now() - startTime;
    cancelAnimationFrame(timerId);
    startBtn.disabled = false;
    stopBtn.disabled = true;
    lapBtn.disabled = true;
    render();
  }

  function reset() {
    running = false;
    cancelAnimationFrame(timerId);
    elapsed = 0;
    lapCount = 0;
    if (birthDate) {
      baselineNow = new Date();
      birthInfo.classList.remove('error');
      birthInfo.textContent = `기대 수명 ${LIFE_EXPECTANCY_YEARS}세 기준 예상 종료 시점: ${formatDate(deathDate)}`;
    }
    render();
    setBirthInputEditable(true);
    startBtn.disabled = !deathDate;
    stopBtn.disabled = true;
    lapBtn.disabled = true;
    resetBtn.disabled = true;
    lapsEl.innerHTML = '';
    lapsEl.appendChild(emptyMsg);
  }

  function addLap() {
    lapCount++;
    const curElapsed = currentElapsedMs();
    const { main, ms } = formatElapsed(curElapsed);
    const life = deathDate ? renderLife(getVirtualNow()) : null;

    if (emptyMsg.parentNode) emptyMsg.remove();
    const item = document.createElement('div');
    item.className = 'lap-item';
    item.innerHTML = `
      <div class="lap-row"><span>랩 ${lapCount}</span><span>${main}${ms}</span></div>
      ${life ? `<div class="lap-remaining">잔여 수명 ${life.main} ${life.sub}</div>` : ''}
    `;
    lapsEl.prepend(item);
  }

  birthdateInput.addEventListener('change', applyBirthdate);
  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
  lapBtn.addEventListener('click', addLap);
  resetBtn.addEventListener('click', reset);

  render();
</script>
</body>
</html>
