<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>제주 항공권 플래너</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: rgba(255,255,255,0.72);
    --surface-solid: #ffffff;
    --border: rgba(60,60,67,0.12);
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --green: #34c759;
    --amber: #ffcc00;
    --red: #ff3b30;
    --gray: #aeaeb2;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --surface: rgba(28,28,30,0.72);
      --surface-solid: #1c1c1e;
      --border: rgba(255,255,255,0.12);
      --text: #f5f5f7;
      --muted: #98989d;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --surface: rgba(28,28,30,0.72);
    --surface-solid: #1c1c1e;
    --border: rgba(255,255,255,0.12);
    --text: #f5f5f7;
    --muted: #98989d;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    padding-top: env(safe-area-inset-top, 0px);
  }
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px 12px;
  }
  .title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; }
  .segmented {
    display: flex;
    background: rgba(118,118,128,0.12);
    border-radius: 10px;
    padding: 2px;
    gap: 2px;
  }
  .segmented button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease;
  }
  .segmented button.active {
    background: var(--surface-solid);
    box-shadow: var(--shadow);
  }
  .notice {
    margin: 10px 20px 0;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(255,204,0,0.15);
    color: #8a6d00;
  }
  .notice.live { background: rgba(52,199,89,0.15); color: #1f8a3d; }
  .notice.empty { background: rgba(255,59,48,0.15); color: #c62b22; }

  .content { padding: 16px 20px 0; max-width: 640px; margin: 0 auto; }

  .date-strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
  .date-strip::-webkit-scrollbar { display: none; }
  .month-label { display: flex; align-items: flex-end; padding-bottom: 8px; font-size: 12px; color: var(--muted); font-weight: 600; flex-shrink: 0; }
  .date-chip {
    flex-shrink: 0;
    width: 56px;
    padding: 8px 0 10px;
    border-radius: 14px;
    background: var(--surface-solid);
    border: 1px solid var(--border);
    text-align: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    font-family: inherit;
  }
  .date-chip .dow { font-size: 11px; color: var(--muted); font-weight: 600; }
  .date-chip .num { font-size: 18px; font-weight: 700; margin: 2px 0; }
  .date-chip .dot { width: 5px; height: 5px; border-radius: 50%; margin: 0 auto; }
  .date-chip.selected { background: var(--accent); border-color: var(--accent); }
  .date-chip.selected .dow, .date-chip.selected .num { color: #fff; }
  .date-chip.selected .dot { background: #fff !important; }

  .weather-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .weather-card {
    flex: 1;
    background: linear-gradient(160deg, #4facfe10, #00f2fe08);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
  }
  .weather-card .wc-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .weather-card .wc-icon { font-size: 26px; line-height: 1; }
  .weather-card .wc-summary { font-size: 14px; font-weight: 700; margin: 4px 0 8px; }
  .weather-card .wc-metrics { display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
  .weather-card .wc-metrics b { color: var(--text); font-weight: 600; }
  .weather-card.unavailable { opacity: 0.55; }
  .weather-card.unavailable .wc-summary { font-size: 12px; font-weight: 500; }

  .section-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 4px 0 8px; }

  .airline-card {
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .airline-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    cursor: pointer;
    border-top: 1px solid var(--border);
  }
  .airline-row:first-child { border-top: none; }
  .badge {
    width: 34px; height: 34px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 12px; flex-shrink: 0;
    letter-spacing: -0.02em;
  }
  .airline-name { flex: 1; font-size: 14px; font-weight: 600; }
  .status-wrap { display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; }
  .status-label { font-size: 12px; color: var(--muted); min-width: 44px; text-align: right; }
  .chevron { color: var(--gray); font-size: 12px; transition: transform 0.2s ease; }
  .airline-row.open .chevron { transform: rotate(90deg); }

  .detail-panel { padding: 0 14px 14px; display: none; }
  .detail-panel.open { display: block; }
  .detail-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .detail-table th { text-align: left; color: var(--muted); font-weight: 600; font-size: 10px; padding: 4px 6px; border-bottom: 1px solid var(--border); }
  .detail-table td { padding: 7px 6px; border-bottom: 1px solid var(--border); }
  .detail-table tr:last-child td { border-bottom: none; }
  .detail-table tr.outside { opacity: 0.4; }
  .price { font-weight: 600; }
  .dash { color: var(--gray); }
  .row-status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .outside-note { font-size: 10px; color: var(--muted); padding: 6px 6px 0; }

  .empty-state { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 0; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="title">제주 항공권 플래너</div>
    <div class="segmented" id="directionToggle">
      <button data-dir="outbound" class="active">서울 → 제주</button>
      <button data-dir="inbound">제주 → 서울</button>
    </div>
  </div>
  <div id="noticeWrap"></div>

  <div class="content">
    <div class="section-label" id="ruleLabel"></div>
    <div class="date-strip" id="dateStrip"></div>

    <div class="weather-row" id="weatherRow"></div>

    <div class="section-label">항공사별 예약 가능 여부</div>
    <div class="airline-card" id="airlineCard"></div>
  </div>

<script>
const AIRLINE_META = {
  KE: { name: '대한항공', color: '#0a2f6b' },
  OZ: { name: '아시아나항공', color: '#c8102e' },
  '7C': { name: '제주항공', color: '#f5821f' },
  TW: { name: '티웨이항공', color: '#004b93' },
  BX: { name: '에어부산', color: '#0067ac' },
  RS: { name: '에어서울', color: '#00a9e0' },
  ZE: { name: '이스타항공', color: '#8a2be2' },
};
const AIRLINE_ORDER = ['KE', 'OZ', '7C', 'TW', 'BX', 'RS', 'ZE'];

const WEATHER_ICON = {
  '맑음': '☀️', '대체로 맑음': '🌤️', '부분 흐림': '⛅', '흐림': '☁️',
  '안개': '🌫️', '짙은 안개': '🌫️',
  '약한 이슬비': '🌦️', '이슬비': '🌦️', '강한 이슬비': '🌧️',
  '약한 비': '🌦️', '비': '🌧️', '강한 비': '🌧️',
  '약한 눈': '🌨️', '눈': '❄️', '폭설': '❄️',
  '약한 소나기': '🌦️', '소나기': '🌧️', '강한 소나기': '⛈️',
  '뇌우': '⛈️',
};

let flightData = null;
let weatherData = null;
let direction = 'outbound';
let selectedDate = null;
let openAirline = null;

async function boot() {
  const [flightsRes, weatherRes] = await Promise.allSettled([
    fetch('../data/results.json', { cache: 'no-store' }).then(r => r.json()),
    fetch('../data/weather.json', { cache: 'no-store' }).then(r => r.json()),
  ]);
  flightData = flightsRes.status === 'fulfilled' ? flightsRes.value : null;
  weatherData = weatherRes.status === 'fulfilled' ? weatherRes.value : null;

  if (!flightData) {
    document.querySelector('.content').innerHTML = '<div class="empty-state">data/results.json 을 불러오지 못했습니다. scan.py를 먼저 실행하세요.</div>';
    return;
  }

  document.querySelectorAll('#directionToggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      direction = btn.dataset.dir;
      document.querySelectorAll('#directionToggle button').forEach(b => b.classList.toggle('active', b === btn));
      selectedDate = null;
      openAirline = null;
      render();
    });
  });

  renderNotice();
  render();
}

function renderNotice() {
  const all = [...flightData.outbound.flights, ...flightData.inbound.flights];
  const hasMock = all.some(f => f.source === 'mock') || flightData.provider === 'mock';
  const hasLive = all.some(f => f.source === 'live');
  const wrap = document.getElementById('noticeWrap');
  if (all.length === 0) {
    wrap.innerHTML = `<div class="notice empty">실시간 데이터 없음 — config/selectors.yaml 미검증. 목업으로 실행하거나 셀렉터를 채워주세요.</div>`;
  } else if (hasMock && !hasLive) {
    wrap.innerHTML = `<div class="notice">⚠️ 목업(mock) 데이터입니다. 실제 항공권 가격이 아닙니다.</div>`;
  } else {
    wrap.innerHTML = `<div class="notice live">실시간 조회 결과 — 최종 가격/좌석은 항공사 공식 화면에서 재확인하세요.</div>`;
  }
}

function routeInfo() {
  if (direction === 'outbound') {
    return {
      key: 'outbound', depAirport: 'GMP', arrAirport: 'CJU',
      rule: '서울(GMP) → 제주(CJU) · 금요일 10시 이후 또는 토요일 오전 출발',
      dateField: 'dep_dt',
    };
  }
  return {
    key: 'inbound', depAirport: 'CJU', arrAirport: 'GMP',
    rule: '제주(CJU) → 서울(GMP) · 일요일 18시 이후 또는 월요일 전체 도착',
    dateField: 'dep_dt',
  };
}

function candidateDates(routeData) {
  const dates = new Map();
  for (const f of routeData.flights) {
    const key = f.dep_dt.slice(0, 10);
    if (!dates.has(key)) dates.set(key, f.demand);
  }
  return [...dates.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

function render() {
  const info = routeInfo();
  const routeData = flightData[info.key];
  document.getElementById('ruleLabel').textContent = info.rule;

  const dates = candidateDates(routeData);
  if (!selectedDate && dates.length) selectedDate = dates[0][0];

  renderDateStrip(dates);
  renderWeather(info);
  renderAirlines(routeData, info);
}

function renderDateStrip(dates) {
  const strip = document.getElementById('dateStrip');
  strip.innerHTML = '';
  let lastMonth = null;
  for (const [dateStr, demand] of dates) {
    const d = new Date(dateStr + 'T00:00:00');
    const month = d.getMonth() + 1;
    if (month !== lastMonth) {
      const label = document.createElement('div');
      label.className = 'month-label';
      label.textContent = `${month}월`;
      strip.appendChild(label);
      lastMonth = month;
    }
    const chip = document.createElement('button');
    chip.className = 'date-chip' + (dateStr === selectedDate ? ' selected' : '');
    const weekday = ['일','월','화','수','목','금','토'][d.getDay()];
    let dotColor = 'transparent';
    if (demand.is_holiday) dotColor = 'var(--red)';
    else if (demand.is_sandwich_day) dotColor = 'var(--amber)';
    else if (demand.is_long_weekend) dotColor = 'var(--accent)';
    chip.innerHTML = `<div class="dow">${weekday}</div><div class="num">${d.getDate()}</div><div class="dot" style="background:${dotColor}"></div>`;
    chip.addEventListener('click', () => { selectedDate = dateStr; openAirline = null; render(); });
    strip.appendChild(chip);
  }
}

function renderWeather(info) {
  const row = document.getElementById('weatherRow');
  row.innerHTML = '';
  row.appendChild(weatherCard('출발 · ' + info.depAirport, info.depAirport));
  row.appendChild(weatherCard('도착 · ' + info.arrAirport, info.arrAirport));
}

function weatherCard(label, airportCode) {
  const card = document.createElement('div');
  const entry = weatherData?.by_airport?.[airportCode]?.[selectedDate];
  if (!entry) {
    card.className = 'weather-card unavailable';
    card.innerHTML = `<div class="wc-label">${label}</div><div class="wc-summary">예보 범위 밖 (약 ${weatherData?.forecast_horizon_days ?? 14}일 이내만 제공)</div>`;
    return card;
  }
  card.className = 'weather-card';
  card.innerHTML = `
    <div class="wc-label">${label}${entry.source === 'mock' ? ' · 목업' : ''}</div>
    <div class="wc-icon">${WEATHER_ICON[entry.summary] || '🌡️'}</div>
    <div class="wc-summary">${entry.summary} · ${Math.round(entry.temp_low_c)}°~${Math.round(entry.temp_high_c)}°</div>
    <div class="wc-metrics">
      <span>강수 <b>${entry.precip_probability_pct}%</b></span>
      <span>풍속 <b>${entry.wind_speed_kmh}km/h</b></span>
    </div>`;
  return card;
}

function airlineStatus(flights) {
  const inWindow = flights.filter(f => f.in_target_window);
  if (inWindow.length === 0) return { status: 'none', label: '운항없음', color: 'var(--gray)' };
  if (inWindow.some(f => f.seat_status === 'available')) return { status: 'available', label: '있음', color: 'var(--green)' };
  if (inWindow.some(f => f.seat_status === 'limited')) return { status: 'limited', label: '적음', color: 'var(--amber)' };
  return { status: 'soldout', label: '매진', color: 'var(--red)' };
}

function renderAirlines(routeData, info) {
  const card = document.getElementById('airlineCard');
  card.innerHTML = '';

  if (!selectedDate) {
    card.innerHTML = '<div class="empty-state">표시할 날짜가 없습니다.</div>';
    return;
  }

  const flightsByAirline = {};
  for (const f of routeData.flights) {
    if (f.dep_dt.slice(0, 10) !== selectedDate) continue;
    (flightsByAirline[f.airline_code] ||= []).push(f);
  }

  for (const code of AIRLINE_ORDER) {
    const meta = AIRLINE_META[code];
    const flights = (flightsByAirline[code] || []).sort((a, b) => a.dep_dt.localeCompare(b.dep_dt));
    const status = airlineStatus(flights);
    const isOpen = openAirline === code;

    const row = document.createElement('div');
    row.className = 'airline-row' + (isOpen ? ' open' : '');
    row.innerHTML = `
      <div class="badge" style="background:${meta.color}">${code}</div>
      <div class="airline-name">${meta.name}</div>
      <div class="status-wrap">
        <span class="status-dot" style="background:${status.color}"></span>
        <span class="status-label">${status.label}</span>
      </div>
      <span class="chevron">▸</span>`;
    row.addEventListener('click', () => {
      openAirline = isOpen ? null : code;
      render();
    });
    card.appendChild(row);

    const panel = document.createElement('div');
    panel.className = 'detail-panel' + (isOpen ? ' open' : '');
    if (isOpen) {
      panel.appendChild(renderDetailTable(flights, info));
    }
    card.appendChild(panel);
  }
}

function renderDetailTable(flights, info) {
  const wrap = document.createElement('div');
  if (!flights.length) {
    wrap.innerHTML = '<div class="outside-note">이 날짜에 운항하는 편이 없습니다.</div>';
    return wrap;
  }
  const hasOutside = flights.some(f => !f.in_target_window);
  const rows = flights.map(f => {
    const time = f.dep_dt.slice(11, 16);
    const dot = { available: 'var(--green)', limited: 'var(--amber)', soldout: 'var(--red)' }[f.seat_status];
    const eco = f.economy_price_krw != null ? f.economy_price_krw.toLocaleString('ko-KR') + '원' : '<span class="dash">-</span>';
    const biz = f.business_price_krw != null ? f.business_price_krw.toLocaleString('ko-KR') + '원' : '<span class="dash">-</span>';
    return `<tr class="${f.in_target_window ? '' : 'outside'}">
      <td>${time}</td>
      <td><span class="row-status-dot" style="background:${dot}"></span>${f.seat_status === 'available' ? '가능' : f.seat_status === 'limited' ? '적음' : '매진'}</td>
      <td class="price">${eco}</td>
      <td class="price">${biz}</td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <table class="detail-table">
      <thead><tr><th>시간</th><th>좌석</th><th>이코노미</th><th>비즈니스</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${hasOutside ? '<div class="outside-note">흐린 행은 요청하신 시간대(' + (info.key === 'outbound' ? '금 10시~ / 토 오전' : '일 18시~ / 월 전일') + ') 밖의 편입니다.</div>' : ''}`;
  return wrap;
}

boot();
</script>
</body>
</html>
