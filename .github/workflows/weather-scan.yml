name: Weather scan

# 2026-09-15 GitHub Actions 러너에서 실연결 검증 완료 (VERIFICATION.md 참고).
# Open-Meteo는 API 키가 필요 없고 클라우드 IP에서도 정상 응답하므로,
# 날씨만큼은 클라우드에서 자동 갱신이 가능하다. 항공권과 달리 변동이 잦아
# 매일 실행한다.
on:
  schedule:
    - cron: "0 20 * * *" # 05:00 KST
  workflow_dispatch:
  push:
    branches: [claude/jolly-cannon-vp1kcb]
    paths:
      - ".github/workflows/weather-scan.yml"

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flight-tracker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch live forecast
        run: python src/weather_scan.py --provider live

      - name: Commit forecast
        run: |
          git config user.name "flight-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet || git commit -m "chore: refresh live weather forecast"
          git push origin HEAD:${{ github.ref_name }}
