name: Verify live data connectivity

# 개발 샌드박스는 외부 접속이 차단되어 있어 실연결을 확인할 수 없다.
# GitHub 호스팅 러너는 일반 인터넷 접근이 가능하므로, 여기서 실제로 호출해보고
# 그 결과를 로그로 남긴다.
on:
  push:
    branches: [claude/jolly-cannon-vp1kcb]
    paths:
      - "flight-tracker/src/verify_live.py"
      - ".github/workflows/verify-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: flight-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pyyaml playwright
          python -m playwright install --with-deps chromium

      - name: Run live verification
        run: python src/verify_live.py
