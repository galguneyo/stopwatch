name: Weekly Seoul-Jeju flight scan

# 주의 (2026-09-15 실측, VERIFICATION.md 참고): 대한항공·아시아나·제주항공·티웨이는
# GitHub Actions 클라우드 IP에서 403 / Access Denied / HTTP2 오류로 차단된다.
# 즉 이 워크플로만으로는 우선순위 항공사의 실데이터를 가져올 수 없다.
# 실데이터 수집은 사용자 PC(가정용 IP)에서 `python src/scan.py --provider live`로
# 돌리는 경로가 기본이며, 이 워크플로는 self-hosted 러너나 차단이 풀린 경우를 위해 남겨둔다.
on:
  schedule:
    # 매주 월요일 00:00 UTC = 한국시간 09:00
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      provider:
        description: "mock 또는 live"
        default: "live"
        required: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flight-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scan
        # config/selectors.yaml 이 검증(verified: true)된 항공사만 실데이터를 가져온다.
        # 검증된 항공사가 아직 없다면 결과는 0건으로 남고 skipped 사유가 기록된다 —
        # 이는 버그가 아니라 "미검증 값으로 가짜 데이터를 만들지 않는다"는 안전장치다.
        run: python src/scan.py --provider "${{ github.event.inputs.provider || 'live' }}" --weeks-ahead 8

      - name: Build weekly digest report
        run: python src/weekly_report.py

      - name: Commit updated data
        run: |
          git config user.name "flight-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results.json reports/latest.md
          git diff --cached --quiet || git commit -m "chore: weekly flight scan update"
          git push
