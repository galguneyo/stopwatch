name: Weekly Seoul-Jeju flight scan

on:
  schedule:
    # 매주 월요일 00:00 UTC = 한국시간 09:00
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      provider:
        description: "mock 또는 live"
        default: "live"
        required: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flight-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scan
        # config/selectors.yaml 이 검증(verified: true)된 항공사만 실데이터를 가져온다.
        # 검증된 항공사가 아직 없다면 결과는 0건으로 남고 skipped 사유가 기록된다 —
        # 이는 버그가 아니라 "미검증 값으로 가짜 데이터를 만들지 않는다"는 안전장치다.
        run: python src/scan.py --provider "${{ github.event.inputs.provider || 'live' }}" --weeks-ahead 8

      - name: Commit updated data
        run: |
          git config user.name "flight-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results.json
          git diff --cached --quiet || git commit -m "chore: weekly flight scan update"
          git push
